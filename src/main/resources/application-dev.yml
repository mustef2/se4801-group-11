spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/sustainability_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:myPassword!}
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true