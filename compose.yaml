services:
  db:
    image: mysql:8
    container_name: sustainability
    environment:
      MYSQL_ROOT_PASSWORD: myPassword!
      MYSQL_DATABASE: sustainability_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmyPassword!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sustainability-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sustainability-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: myPassword!
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sustainability-network
    restart: on-failure

volumes:
  mysql_data:

networks:
  sustainability-network:
    driver: bridge